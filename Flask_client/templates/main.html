<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>반갑습니다!</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* 스크롤 제거 */
            height: 100%;
            font-family: 'Arial Rounded MT Bold', 'Apple SD Gothic Neo', sans-serif;
        }

        .left-bar {
            width: 200px; /* 가로 바 길이 늘림 */
            height: 100vh;
            background-color: #3a45c2;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            background-color: white;
            color: #3a45c2;
            width: 140px;
            height: 50px;
            text-align: center;
            line-height: 50px;
            border-radius: 8px;
        }

        .button-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            width: 140px;
            height: 40px;
            background-color: white;
            color: #3a45c2;
            border: none;
            border-radius: 10px;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            text-decoration: none; /* 밑줄 제거 */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #3a45c2;
            color: white;
            border: 1px solid white;
        }

        .main-box {
            margin-left: 200px; /* 왼쪽 바 너비만큼 밀기 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        .welcome-text {
            font-size: 2em;
            color: black;
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="left-bar">
        <div class="logo">BlueTalk</div>
        <div class="button-area">
            <a href="#" class="btn">로그인</a>
            <a href="#" class="btn">회원가입</a>
        </div>
    </div>

    <div class="main-box">
        <h1 class="welcome-text">BlueTalk에 오신 것을 환영합니다!</h1>
    </div>
</body>
</html>
