<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>방 만들기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-group {
            margin: 20px 0;
        }

        .select-box {
            width: 85%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>새로운 방을 만들어보세요</h2>

        <div class="form-group">
            <input type="text" class="nickname-input" placeholder="방 제목 입력">
        </div>

        <div class="form-group">
            <select class="select-box">
                {% for num in range(2, 11) %}
                <option value="{{ num }}">{{ num }}명</option>
                {% endfor %}
            </select>
        </div>

        <a href="#" class="chat-start-button">만들기</a>
    </div>
</body>
</html>
