<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>회원가입</title>
  <link rel="stylesheet" href="/static/signup.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>회원가입</h1>
      <p class="subtitle">회원이 되어 다양한 혜택을 경험해 보세요!</p>

      <div class="field">
        <label>아이디</label>
        <div class="row">
          <input id="login_id" type="text" placeholder="아이디 입력 (6~20자)" />
          <button id="btn_check_id" class="btn btn-blue" type="button">중복 확인</button>
        </div>
        <div id="id_msg" class="msg"></div>
      </div>

      <div class="field">
        <label>닉네임</label>
        <div class="row">
          <input id="nickname" type="text" placeholder="닉네임 입력 (2~20자)" />
          <button id="btn_check_nick" class="btn btn-blue" type="button">중복 확인</button>
        </div>
        <div id="nick_msg" class="msg"></div>
      </div>


      <div class="field">
        <label>비밀번호</label>
        <input id="password" type="password" placeholder="비밀번호 입력 (8~20자, 2종 조합)" />
        <div id="pw_msg" class="msg"></div>
      </div>

      <div class="field">
        <label>비밀번호 확인</label>
        <input id="password2" type="password" placeholder="비밀번호 재입력" />
        <div id="pw2_msg" class="msg"></div>
      </div>

      <div class="field">
        <label>이메일 주소</label>
        <div class="row">
          <input id="email" type="email" placeholder="example@email.com" />
          <button id="btn_send_code" class="btn btn-blue" type="button">인증번호 발송</button>
        </div>
        <div id="email_msg" class="msg"></div>
      </div>

      <div class="field">
        <label>인증번호</label>
        <div class="row">
          <input id="code" type="text" placeholder="6자리 인증번호" />
          <button id="btn_verify_code" class="btn btn-blue" type="button">인증 확인</button>
        </div>
        <div id="code_msg" class="msg"></div>
      </div>

      <div class="actions">
        <button id="btn_register" class="btn btn-primary" type="button">가입하기</button>
        <button id="btn_cancel" class="btn btn-yellow" type="button">가입취소</button>
      </div>
    </div>
  </div>

  <script src="/static/signup.js"></script>
</body>
</html>
